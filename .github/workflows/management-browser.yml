name: Management browser checks
on:
  pull_request:
    paths:
      - 'crm.py'
      - 'crm_home.py'
      - 'home_theme.py'
      - 'home_sidebar.py'
      - 'anuncios_progress*.py'
      - 'anuncios_progresso.json'
      - 'scripts/anuncios_progress*'
      - 'test_anuncios_progress.py'
      - 'navigation_shell.py'
      - 'store_sidebar.py'
      - 'ads_overview_design.py'
      - 'test_store_ads_design.py'
      - 'test_unified_publicidade.py'
      - 'scripts/ads_overview*'
      - 'test_home_sidebar.py'
      - 'ads_campaign_detail.py'
      - 'ads_official_metrics.py'
      - 'test_ads_official_metrics.py'
      - 'test_ads_campaign_detail.py'
      - 'scripts/ads_chart*'
      - 'client_home.py'
      - 'scripts/crm_home*'
      - 'management*.py'
      - 'visual_theme.py'
      - 'main.py'
      - 'freight_audit_view.py'
      - 'freight_difference_view.py'
      - 'freight_sales_compare.py'
      - 'freight_store.py'
      - 'test_freight_differences.py'
      - 'test_freight_audit_view.py'
      - 'scripts/freight_audit*'
      - 'sales_view.py'
      - 'scripts/sales_theme*'
      - 'costs_theme.py'
      - 'scripts/costs_theme*'
      - 'keiper_ai*.py'
      - 'kevia_finance*.py'
      - 'test_kevia_finance*.py'
      - 'scripts/kevia_finance*'
      - 'kyra_theme.py'
      - 'kyra_campaign*.py'
      - 'chart_personalization.py'
      - 'scripts/kyra*'
      - 'test_management*.py'
      - 'scripts/management*'
      - '.github/workflows/management-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/management_preview.py
      - run: python scripts/sales_theme_preview.py
      - run: python scripts/costs_theme_preview.py
      - run: python scripts/anuncios_progress_preview.py
      - run: python scripts/store_navigation_preview.py
      - run: python scripts/crm_home_preview.py
      - run: python scripts/home_alerts_preview.py
      - run: python scripts/ads_chart_preview.py
      - run: python scripts/ads_overview_preview.py
      - run: python scripts/kyra_preview.py
      - run: python scripts/kevia_finance_preview.py
      - run: python scripts/freight_audit_preview.py
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      # The hosted Ubuntu image already includes Chromium runtime libraries.
      - run: npx playwright install chromium
        timeout-minutes: 4
      - run: node scripts/management_browser_check.cjs
      - run: node scripts/sales_theme_browser_check.cjs
      - run: node scripts/costs_theme_browser_check.cjs
      - run: node scripts/anuncios_progress_browser_check.cjs
      - run: node scripts/store_navigation_browser_check.cjs
      - run: node scripts/crm_home_browser_check.cjs
      - run: node scripts/home_alerts_browser_check.cjs
      - run: node scripts/ads_chart_browser_check.cjs
      - run: node scripts/ads_overview_browser_check.cjs
      - run: node scripts/kyra_browser_check.cjs
      - run: node scripts/kevia_finance_browser_check.cjs
      - run: node scripts/freight_audit_browser_check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: management-desktop-mobile
          path: visual-qa/
          retention-days: 7
