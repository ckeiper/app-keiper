name: Title optimizer checks
on:
  pull_request:
    paths:
      - 'static/title_optimizer*'
      - 'extensions/title_optimizer/**'
      - 'title_optimizer*.py'
      - 'test_title_optimizer.py'
      - 'scripts/title_optimizer*'
      - '.github/workflows/title-optimizer.yml'
permissions:
  contents: read
jobs:
  title-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/title_optimizer_test.mjs
      - run: node --check static/title_optimizer_view.mjs
      - run: node --check extensions/title_optimizer/search.js
  title-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask requests psycopg2-binary
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Check controlled UI
        run: |
          python scripts/title_optimizer_preview.py > /tmp/title-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/otimizador-titulos/1 > /dev/null; then break; fi
            sleep 1
          done
          node scripts/title_optimizer_browser_check.cjs
