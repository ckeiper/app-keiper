name: Sales tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: keiper_test
          POSTGRES_USER: keiper_test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keiper_test -d keiper_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python scripts/audit_anuncios.py --check
      - run: python -m unittest -v
        env:
          KEIPER_TEST_DATABASE_URL: postgresql://keiper_test:test_only@localhost:5432/keiper_test
          SECRET_KEY: isolated-test-key

      - name: Validate Gunicorn configuration
        run: gunicorn --check-config 'flask:Flask("config-check")'
