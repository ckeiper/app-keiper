name: Central Ads checks
on:
  pull_request:
    paths:
      - 'ads_central.py'
      - 'main.py'
      - 'home_sidebar.py'
      - '.github/workflows/central-ads.yml'
  push:
    branches:
      - feature/central-ads-black-friday
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed Python modules
        run: python -m py_compile ads_central.py main.py home_sidebar.py
