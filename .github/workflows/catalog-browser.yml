name: Catalog browser checks
on:
  pull_request:
    paths:
      - 'listing_catalog.py'
      - 'listing_competitiveness.py'
      - 'offer_history.py'
      - 'test_listing_competitiveness.py'
      - 'listing_timeline.py'
      - 'listing_interventions.py'
      - 'automatic_history.py'
      - 'test_automatic_history.py'
      - 'intervention_routes.py'
      - 'listing_diagnostic_design.py'
      - 'listing_priority_evidence.py'
      - 'listing_priority_sources.py'
      - 'test_stock_priority_details.py'
      - 'listing_priority_queue.py'
      - 'listing_action_plan.py'
      - 'test_listing_action_plan.py'
      - 'test_profitability_priority.py'
      - 'profitability_*.py'
      - 'listing_profitability.py'
      - 'test_profitability.py'
      - 'scripts/profitability*'
      - 'test_listing_interventions.py'
      - 'scripts/interventions*'
      - 'investigation_evidence.py'
      - 'investigation_triage.py'
      - 'sales_drivers.py'
      - 'test_sales_drivers.py'
      - 'test_investigation*.py'
      - 'test_listing_timeline.py'
      - 'scripts/timeline*'
      - 'management_design.py'
      - 'main.py'
      - 'test_listing_catalog.py'
      - 'scripts/catalog*'
      - '.github/workflows/catalog-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/catalog_preview.py
      - run: python scripts/timeline_preview.py
      - run: python scripts/interventions_preview.py
      - run: python scripts/profitability_preview.py
      - run: python scripts/profitability_priority_preview.py
      - run: npm install --no-save --no-package-lock playwright@1.51.1 chart.js@4.4.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/catalog_browser_check.cjs
      - run: node scripts/timeline_browser_check.cjs
      - run: node scripts/interventions_browser_check.cjs
      - run: node scripts/profitability_browser_check.cjs
      - run: node scripts/profitability_priority_browser_check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-desktop-mobile
          path: visual-qa/
          retention-days: 7
