  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/catalog_preview.py
      - run: python scripts/listing_tasks_preview.py
      - run: python scripts/promotion_comparison_preview.py
      - run: python scripts/listing_kits_preview.py
      - run: python scripts/listing_calendar_preview.py
      - run: python scripts/price_stability_preview.py
      - run: python scripts/price_deviation_preview.py
