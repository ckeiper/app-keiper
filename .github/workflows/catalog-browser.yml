      - run: node scripts/listing_buyer_reviews_browser_check.cjs
      - run: node scripts/listing_questions_browser_check.cjs
      - run: node scripts/listing_content_browser_check.cjs
      - run: node scripts/listing_content_snapshot_browser_check.cjs
      - run: node scripts/content_rate_limit_browser_check.cjs
      - run: node scripts/content_number_attributes_browser_check.cjs
      - run: node scripts/content_list_attributes_browser_check.cjs
      - run: node scripts/content_boolean_attributes_browser_check.cjs
      - run: node scripts/content_technical_specs_browser_check.cjs
      - run: node scripts/attribute_editor_browser_check.cjs
      - run: node scripts/content_attribute_units_browser_check.cjs
      - run: node scripts/full_report_browser_check.cjs
