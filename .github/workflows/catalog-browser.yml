      - run: python scripts/listing_content_snapshot_preview.py
      - run: python scripts/content_rate_limit_preview.py
      - run: python scripts/content_number_attributes_preview.py
      - run: python scripts/content_list_attributes_preview.py
      - run: python scripts/content_boolean_attributes_preview.py
      - run: python scripts/content_technical_specs_preview.py
      - run: python scripts/attribute_editor_preview.py
      - run: python scripts/content_attribute_units_preview.py
      - run: python scripts/full_report_preview.py
      - run: python scripts/timeline_preview.py
      - run: python scripts/interventions_preview.py
      - run: python scripts/profitability_preview.py
      - run: python scripts/profitability_priority_preview.py
      - run: npm install --no-save --no-package-lock playwright@1.51.1 chart.js@4.4.1
      # Ubuntu's hosted image already supplies Chromium's runtime libraries.
      # Avoid upgrading OS packages from slow mirrors before browser checks.
      - run: npx playwright install chromium
        timeout-minutes: 4
      - run: node scripts/catalog_browser_check.cjs
      - run: node scripts/listing_tasks_browser_check.cjs
      - run: node scripts/promotion_comparison_browser_check.cjs
      - run: node scripts/listing_kits_browser_check.cjs
      - run: node scripts/listing_calendar_browser_check.cjs
      - run: node scripts/price_stability_browser_check.cjs
      - run: node scripts/price_deviation_browser_check.cjs
      - run: node scripts/installment_comparison_browser_check.cjs
      - run: node scripts/listing_fee_quote_browser_check.cjs
      - run: node scripts/listing_sku_overlap_browser_check.cjs
      - run: node scripts/listing_sku_variations_browser_check.cjs
      - run: node scripts/listing_reactivation_browser_check.cjs
