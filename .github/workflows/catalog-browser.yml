name: Catalog browser checks
on:
  pull_request:
    paths:
      - 'listing_catalog.py'
      - 'management_design.py'
      - 'main.py'
      - 'test_listing_catalog.py'
      - 'scripts/catalog*'
      - '.github/workflows/catalog-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/catalog_preview.py
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/catalog_browser_check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-desktop-mobile
          path: visual-qa/
          retention-days: 7
